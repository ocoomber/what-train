<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0d12" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>My Train — what train am I on?</title>
  <meta name="description" content="A zero-typing PWA that uses your location to tell you what UK train you're on and every remaining stop, with live ETAs, platforms and delays." />

  <!-- Open Graph: text-only share card by design (no og:image — no brand share asset yet). -->
  <meta property="og:title" content="My Train — what train am I on?" />
  <meta property="og:description" content="Open it on a UK train and it tells you which service you're on and what's coming next. No typing, no keyboard." />
  <meta property="og:url" content="https://what-train.ocoomber.workers.dev/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="My Train" />

  <!-- Structured data: how machines (search, agents, future Claude) understand the page. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "My Train",
    "description": "A zero-typing Progressive Web App that uses geolocation to tell a UK rail passenger what train they're on and every remaining stop, with live ETAs, platforms and delay status.",
    "url": "https://what-train.ocoomber.workers.dev/",
    "applicationCategory": "TravelApplication",
    "operatingSystem": "Any",
    "browserRequirements": "Requires JavaScript and geolocation.",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "GBP" }
  }
  </script>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="topbar">
    <button id="back-btn" class="back-btn" aria-label="Back" type="button" data-agent-target="back">←</button>
    <div class="topbar-titles">
      <span id="view-title">My Train</span>
      <span class="status-line">
        <span id="status-dot" class="dot"></span>
        <span id="status-text" role="status" aria-live="polite">STARTING</span>
      </span>
    </div>
    <span id="speed-readout"></span>
    <button id="help-btn" class="help-btn" aria-label="How it works" type="button" aria-expanded="false" data-agent-target="open-help">?</button>
  </header>

  <main id="screen">
    <!-- Screens are rendered here by app.js -->
  </main>

  <nav id="tabbar" aria-label="Main navigation">
    <button class="tab" type="button" data-nav="nearby" data-agent-target="nav-nearby">
      <svg class="tab-ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5Z"/></svg>
      <span class="tab-label">Nearby</span>
    </button>
    <button class="tab" type="button" data-nav="pinned" data-agent-target="nav-pinned">
      <svg class="tab-ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14l-5-4.87 6.91-1.01Z"/></svg>
      <span class="tab-label">Pinned</span>
    </button>
    <button class="tab" type="button" data-nav="train" data-agent-target="nav-train">
      <svg class="tab-ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 2h10a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3h-1l2 3h-2.2l-1.33-2H9.53L8.2 20H6l2-3H7a3 3 0 0 1-3-3V5a3 3 0 0 1 3-3Zm0 2a1 1 0 0 0-1 1v4h12V5a1 1 0 0 0-1-1H7Zm1.5 11a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Zm7 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"/></svg>
      <span class="tab-label">My train</span>
    </button>
  </nav>

  <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>

  <script src="vendor/qrcode.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
